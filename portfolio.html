<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Jaini+Purva&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Laila:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            overflow-x: hidden;
            width: 100vw;
               background: radial-gradient(
        circle at var(--x, 50%) var(--y, 50%),
        rgba(0, 227, 252, 0.987),
        #000 1%
    );
        }

        .logo {
            font-family: 'Jaini Purva', cursive;
            font-size: 36px;
            color: #00E5FF;
            font-weight: 900;
            letter-spacing: 2px;
            padding-right: 100px;
        }

        .navbar {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
            padding: 60px;
            border: 1px solid #00E5FF;
            box-shadow: 1px 1px 10px #00E5FF;
            border-radius: 20px;
            height: 30px;


        }

        .navbar ul {
            display: flex;
            flex-direction: row;
            gap: 50px;
            list-style: none;
            flex-wrap: wrap;
            padding-right: 40px;

        }

        .navbar ul li a {
            text-decoration: none;
            color: white;
            font-family: 'Jockey One', sans-serif;
            font-size: 24px;
            font-weight: 500;
            opacity: 0.8;
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background-color 0.4s ease,
                color 0.4s ease;

            cursor: pointer;

        }

        .navbar ul li:hover {
            transform: scale(1.1);

        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .content {
            display: flex;
            flex-direction: column;
            height: 80vh;
            gap-bottom: 10px;
            padding-top: 100px;
            padding-left: 100px;
            overflow: hidden;
            white-space: nowrap;


        }

        p1 {
            font-family: 'jaini purva', cursive;
            font-size: 24px;
            color: white;
            opacity: 0.8;
            animation: slideInLeft 3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            animation-delay: 0.2s;
            overflow: hidden;
            white-space: nowrap;
            transform 0.25s ease,
            box-shadow 0.25s ease,
            background-color 0.4s ease,
            color 0.4s ease;
            opacity: 0;

        }

        p2 {
            font-family: 'jaini purva', cursive;
            font-size: 36px;
            color: white;
            opacity: 0.8;
            animation: slideInLeft 3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            animation-delay: 0.5s;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0;
        }

        p3 {

            font-family: 'jaini purva', cursive;
            font-size: 76px;
            color: #00E5FF;
            opacity: 0.8;
            animation: slideInLeft 3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            animation-delay: 0.7s;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0;
        }

        .image {
            float: right;
            position: relative;
            left: 220px;
            z-index:0;
        }

        .image img {
            width: 1200px;
            height: fit-content;
            margin-right: 200px;
            z-index:0;
        }

        .Hire {
            opacity: 0;
            display: flex;
            background: linear-gradient(to bottom, #00E5FF 36%, #008999 91%);
            width: fit-content;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 26px;
            margin-top: 50px;
            font-family: 'Laila', serif;
            flex-wrap: wrap;
            padding-right: 10px;
            padding-left: 10px;
            text-decoration: none;
            animation: popIn 2s ease-out forwards;
            Animation-delay: 0.9s;
            overflow: hidden;
            white-space: nowrap;
            font-weight: 500;
        }

        .Hire:hover {
            transform: scale(1.05);
            background: linear-gradient(to bottom, #008999 36%, #00E5FF 91%);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .container {
            display: flex;
            gap: 50px;
            flex-direction: row;
        }

        .resume a {
            font-size: 20px;
            background: linear-gradient(to bottom, #FFFFFF 10%, #808080 57%);
            color: #000000;
            font-weight: 500;
            font-family: 'Lalezar', cursive;

        }

        .resume a:hover {
            background: linear-gradient(to bottom, #808080 10%, #FFFFFF 57%);
            color: #000000;
            transform: scale(1.05);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(to right, #2c2c2c, #444);
            padding: 30px;
            border-radius: 20px;
            color: white;
            margin-top: 50px;
            animation: popIn 3s ease-out forwards;
        }

        .stat {
            text-align: center;
            flex: 1;
            position: relative;
        }


        .stat:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 2px;
            background: white;
        }

        .count {
            font-size: 28px;
            font-weight: bold;
            color: #00E5FF;
        }
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

    background-size: 40px 40px;

    z-index: 0;
}
.container, header, section {
    position: relative;
    z-index: 1;
}
    </style>
</head>

<body>
    <navbar class="navbar">
        <div class="logo">
            <h1>Portfolio</h1>
        </div>
        <ul>
            <li><a href="../portfolio.html">Home</a></li>
            <li><a href="../about.html">About</a></li>
            <li><a href="../contact.html">Contact</a></li>
            <li><a href="../projects.html">Projects</a></li>
        </ul>
    </navbar>
    <div class="image">
        <img src="photo.png" alt="Portfolio Image">>
    </div>
    <div class="content">
        <p1>Hello</p1><br>
        <p2>I am Sanjith</p2><br>
        <p3>UI/UX Designer</p3>
        <div class="container">
            <div class="links">
                <a href="forms.html" class="Hire">Hire me</a>
            </div>
            <div class="links resume">
                <a href="resume.pdf" class="Hire" download>Download Resume</a>
            </div>
        </div>
        <div class="stats">
            <div class="stat">
                <h2 class="count" data-target="5">0</h2>
                <p>Experiences</p>
            </div>

            <div class="stat">
                <h2 class="count" data-target="20">0</h2>
                <p>Projects done</p>
            </div>

            <div class="stat">
                <h2 class="count" data-target="100">0</h2>
                <p>Happy clients</p>
            </div>
        </div>

    </div>


    </div>
    <script>
        const counters = document.querySelectorAll(".count");

        counters.forEach(counter => {
            const target = +counter.getAttribute("data-target");
            let count = 0;

            const updateCount = () => {
                const speed = 50; // lower = faster
                const increment = target / speed;

                if (count < target) {
                    count += increment;
                    counter.innerText = Math.ceil(count) + "+";
                    setTimeout(updateCount, 50);
                } else {
                    counter.innerText = target + "+";
                }
            };

            updateCount();
        });
        document.addEventListener("mousemove", (e) => {
    document.body.style.setProperty("--x", e.clientX + "px");
    document.body.style.setProperty("--y", e.clientY + "px");

});
    </script>
</body>

</html>
